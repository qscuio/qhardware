<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:8 7}.a{stroke:#172033;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#172033"/></marker></defs><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">PCB 回流路径、布局与测量</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">信号与回流必须一起看</text><line x1="80" y1="180" x2="500" y2="180" class="a"/><text x="80" y="165" class="s">信号去程</text><line x1="500" y1="255" x2="80" y2="255" class="a"/><text x="360" y="285" class="s">参考平面回流</text><rect x="260" y="205" width="90" height="28" class="b"/><text x="305" y="225" text-anchor="middle" class="s">平面缝隙</text><path d="M275 205 C250 160,225 160,205 180" class="dash"/><text x="305" y="315" text-anchor="middle" class="s">跨缝会迫使回流绕路，增大环路、串扰和辐射</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">去耦电容的关键回路</text><rect x="690" y="165" width="130" height="95" rx="10" class="b"/><text x="755" y="207" text-anchor="middle" class="s">IC</text><text x="755" y="234" text-anchor="middle" class="s">VDD / GND</text><rect x="930" y="180" width="75" height="65" class="b"/><text x="967" y="220" text-anchor="middle" class="s">Cdec</text><line x1="820" y1="190" x2="930" y2="190" class="w"/><line x1="820" y1="240" x2="930" y2="240" class="w"/><path d="M825 190 C880 150,920 150,965 180" class="dash"/><text x="895" y="295" text-anchor="middle" class="s">电容越近、回路越短，寄生电感越小</text><rect x="35" y="365" width="540" height="255" rx="14" class="b"/><text x="305" y="398" text-anchor="middle" class="h">Kelvin 采样</text><rect x="175" y="475" width="250" height="48" class="b"/><text x="300" y="506" text-anchor="middle" class="s">大电流分流电阻</text><line x1="75" y1="499" x2="175" y2="499" class="w"/><line x1="425" y1="499" x2="525" y2="499" class="w"/><line x1="200" y1="523" x2="200" y2="575" class="dash"/><line x1="400" y1="523" x2="400" y2="575" class="dash"/><text x="300" y="595" text-anchor="middle" class="s">测量线直接从电阻焊盘内侧引出，不混入铜箔压降</text><rect x="625" y="365" width="540" height="255" rx="14" class="b"/><text x="895" y="398" text-anchor="middle" class="h">示波器探测</text><rect x="690" y="460" width="130" height="85" rx="10" class="b"/><text x="755" y="497" text-anchor="middle" class="s">被测节点</text><text x="755" y="524" text-anchor="middle" class="s">快速边沿</text><line x1="820" y1="500" x2="930" y2="500" class="w"/><circle cx="955" cy="500" r="28" class="b"/><text x="955" y="506" text-anchor="middle" class="s">探头</text><path d="M955 528 C1010 590,1080 590,1080 520" class="dash"/><text x="1010" y="610" text-anchor="middle" class="s">长地夹形成大环路并制造假振铃</text><text x="895" y="575" text-anchor="middle" class="s">高速测量优先使用短地弹簧或同轴连接</text></svg>