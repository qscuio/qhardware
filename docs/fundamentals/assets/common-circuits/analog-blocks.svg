<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.tri{stroke:#172033;stroke-width:3;fill:#fff}</style><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">常见模拟信号调理模块</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">电压跟随器</text><text x="75" y="205" class="s">Vin</text><line x1="120" y1="200" x2="230" y2="200" class="w"/><polygon points="230,145 230,255 360,200" class="tri"/><text x="248" y="181" class="s">+</text><text x="248" y="230" class="s">−</text><line x1="360" y1="200" x2="490" y2="200" class="w"/><text x="500" y="207" class="s">Vout</text><path d="M430 200 V285 H205 V230 H230" class="w"/><text x="305" y="310" text-anchor="middle" class="s">高输入阻抗、低输出阻抗；隔离前后级</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">同相 / 反相放大</text><polygon points="820,145 820,255 950,200" class="tri"/><text x="838" y="181" class="s">+</text><text x="838" y="230" class="s">−</text><line x1="950" y1="200" x2="1080" y2="200" class="w"/><rect x="865" y="275" width="115" height="35" class="b"/><text x="922" y="299" text-anchor="middle" class="s">Rf</text><path d="M1015 200 V292 H980" class="w"/><line x1="865" y1="292" x2="820" y2="225" class="w"/><text x="895" y="320" text-anchor="middle" class="s">增益由反馈电阻比决定</text><rect x="35" y="365" width="540" height="255" rx="14" class="b"/><text x="305" y="398" text-anchor="middle" class="h">差分 / 仪表放大</text><text x="75" y="470" class="s">V+</text><text x="75" y="555" class="s">V−</text><line x1="115" y1="465" x2="235" y2="465" class="w"/><line x1="115" y1="550" x2="235" y2="550" class="w"/><rect x="235" y="430" width="170" height="155" rx="12" class="b"/><text x="320" y="500" text-anchor="middle" class="s">差分 / INA</text><text x="320" y="527" text-anchor="middle" class="s">高 CMRR</text><line x1="405" y1="508" x2="510" y2="508" class="w"/><text x="305" y="610" text-anchor="middle" class="s">测桥式传感器、分流电阻和微小差分信号</text><rect x="625" y="365" width="540" height="255" rx="14" class="b"/><text x="895" y="398" text-anchor="middle" class="h">跨阻放大器</text><text x="680" y="500" class="s">Iin</text><line x1="725" y1="495" x2="815" y2="495" class="w"/><polygon points="815,440 815,550 945,495" class="tri"/><text x="833" y="476" class="s">+</text><text x="833" y="525" class="s">−</text><line x1="945" y1="495" x2="1080" y2="495" class="w"/><rect x="860" y="575" width="115" height="35" class="b"/><text x="917" y="599" text-anchor="middle" class="s">Rf ∥ Cf</text><path d="M1015 495 V592 H975" class="w"/><line x1="860" y1="592" x2="815" y2="520" class="w"/><text x="895" y="635" text-anchor="middle" class="s">Vout ≈ −Iin·Rf；Cf 用于稳定和限带</text></svg>