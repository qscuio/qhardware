<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.a{stroke:#172033;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#172033"/></marker></defs><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">输入、电源与感性负载保护</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">保险丝 + TVS</text><text x="70" y="195" class="s">接口</text><line x1="115" y1="190" x2="175" y2="190" class="w"/><rect x="175" y="170" width="95" height="40" class="b"/><text x="222" y="197" text-anchor="middle" class="s">FUSE</text><line x1="270" y1="190" x2="480" y2="190" class="w"/><text x="490" y="197" class="s">系统</text><line x1="350" y1="190" x2="350" y2="245" class="w"/><rect x="315" y="245" width="70" height="45" class="b"/><text x="350" y="274" text-anchor="middle" class="s">TVS</text><text x="305" y="315" text-anchor="middle" class="s">TVS 钳位；保险丝切断持续故障能量</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">反接保护</text><text x="680" y="190" class="s">VIN</text><line x1="730" y1="185" x2="795" y2="185" class="w"/><polygon points="795,160 795,210 850,185" class="b"/><line x1="850" y1="155" x2="850" y2="215" class="w"/><line x1="850" y1="185" x2="1065" y2="185" class="w"/><text x="1075" y="192" class="s">VOUT</text><text x="895" y="252" text-anchor="middle" class="s">简单二极管有压降；P-MOS/理想二极管损耗更低</text><rect x="35" y="365" width="540" height="255" rx="14" class="b"/><text x="305" y="398" text-anchor="middle" class="h">信号钳位</text><text x="75" y="495" class="s">外部信号</text><line x1="160" y1="490" x2="220" y2="490" class="w"/><rect x="220" y="472" width="110" height="36" class="b"/><text x="275" y="497" text-anchor="middle" class="s">Rlimit</text><line x1="330" y1="490" x2="470" y2="490" class="w"/><text x="480" y="497" class="s">MCU/ADC</text><line x1="390" y1="490" x2="390" y2="445" class="w"/><rect x="355" y="410" width="70" height="35" class="b"/><text x="390" y="434" text-anchor="middle" class="s">Clamp</text><text x="305" y="575" text-anchor="middle" class="s">先限流，再钳位；检查注入电流和结电容</text><rect x="625" y="365" width="540" height="255" rx="14" class="b"/><text x="895" y="398" text-anchor="middle" class="h">续流 / 反电动势钳位</text><text x="690" y="470" class="s">+V</text><rect x="760" y="435" width="100" height="70" rx="10" class="b"/><text x="810" y="477" text-anchor="middle" class="s">线圈</text><line x1="810" y1="505" x2="810" y2="560" class="w"/><rect x="770" y="560" width="80" height="38" class="b"/><text x="810" y="586" text-anchor="middle" class="s">开关</text><path d="M810 535 C960 535,960 445,835 445" class="a"/><text x="1000" y="493" text-anchor="middle" class="s">二极管/TVS 提供关断电流回路</text></svg>