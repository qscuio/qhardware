<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.n{fill:#172033}</style><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">数字接口与物理层常见结构</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">开漏总线 / I²C</text><text x="120" y="145" class="s">VDD</text><rect x="105" y="165" width="55" height="85" class="b"/><text x="178" y="213" class="s">Rpull-up</text><circle cx="132" cy="275" r="5" class="n"/><line x1="132" y1="250" x2="132" y2="275" class="w"/><line x1="132" y1="275" x2="500" y2="275" class="w"/><rect x="220" y="190" width="110" height="55" rx="8" class="b"/><text x="275" y="224" text-anchor="middle" class="s">设备 A</text><rect x="380" y="190" width="110" height="55" rx="8" class="b"/><text x="435" y="224" text-anchor="middle" class="s">设备 B</text><text x="305" y="310" text-anchor="middle" class="s">器件只负责拉低；上升沿由 Rpull-up 与总线电容决定</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">源端串联端接</text><rect x="680" y="165" width="120" height="70" rx="8" class="b"/><text x="740" y="208" text-anchor="middle" class="s">Driver</text><line x1="800" y1="200" x2="835" y2="200" class="w"/><rect x="835" y="182" width="100" height="36" class="b"/><text x="885" y="207" text-anchor="middle" class="s">Rs</text><line x1="935" y1="200" x2="1030" y2="200" class="w"/><rect x="1030" y="165" width="100" height="70" rx="8" class="b"/><text x="1080" y="208" text-anchor="middle" class="s">Load</text><text x="895" y="285" text-anchor="middle" class="s">Rs + 驱动器输出阻抗 ≈ 走线特性阻抗</text><rect x="35" y="365" width="540" height="255" rx="14" class="b"/><text x="305" y="398" text-anchor="middle" class="h">差分端接：CAN / RS-485</text><line x1="95" y1="475" x2="500" y2="475" class="w"/><line x1="95" y1="555" x2="500" y2="555" class="w"/><text x="70" y="482" class="s">H / A</text><text x="70" y="562" class="s">L / B</text><rect x="430" y="490" width="55" height="50" class="b"/><text x="457" y="522" text-anchor="middle" class="s">RT</text><line x1="457" y1="475" x2="457" y2="490" class="w"/><line x1="457" y1="540" x2="457" y2="555" class="w"/><text x="305" y="600" text-anchor="middle" class="s">只在总线物理两端端接；避免星形和长支线</text><rect x="625" y="365" width="540" height="255" rx="14" class="b"/><text x="895" y="398" text-anchor="middle" class="h">隔离接口</text><rect x="680" y="455" width="150" height="100" rx="10" class="b"/><text x="755" y="498" text-anchor="middle" class="s">逻辑域 A</text><text x="755" y="526" text-anchor="middle" class="s">GND_A</text><rect x="960" y="455" width="150" height="100" rx="10" class="b"/><text x="1035" y="498" text-anchor="middle" class="s">逻辑域 B</text><text x="1035" y="526" text-anchor="middle" class="s">GND_B</text><rect x="855" y="445" width="80" height="120" rx="10" class="b"/><text x="895" y="496" text-anchor="middle" class="s">数字</text><text x="895" y="523" text-anchor="middle" class="s">隔离器</text><line x1="830" y1="505" x2="855" y2="505" class="w"/><line x1="935" y1="505" x2="960" y2="505" class="w"/><text x="895" y="600" text-anchor="middle" class="s">信号隔离后，通常还需要隔离电源</text></svg>