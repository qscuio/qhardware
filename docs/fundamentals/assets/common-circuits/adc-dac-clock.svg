<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.a{stroke:#172033;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#172033"/></marker></defs><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">ADC、DAC、传感器与时钟外围</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">ADC 输入前端</text><rect x="70" y="165" width="105" height="65" rx="8" class="b"/><text x="122" y="204" text-anchor="middle" class="s">传感器</text><line x1="175" y1="197" x2="225" y2="197" class="a"/><rect x="225" y="165" width="105" height="65" rx="8" class="b"/><text x="277" y="191" text-anchor="middle" class="s">分压/缓冲</text><text x="277" y="216" text-anchor="middle" class="s">保护</text><line x1="330" y1="197" x2="380" y2="197" class="a"/><rect x="380" y="165" width="105" height="65" rx="8" class="b"/><text x="432" y="204" text-anchor="middle" class="s">RC 低通</text><line x1="485" y1="197" x2="520" y2="197" class="a"/><text x="305" y="290" text-anchor="middle" class="s">检查范围、源阻抗、采样时间、抗混叠与钳位电流</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">PWM + RC 简易 DAC</text><rect x="680" y="165" width="125" height="65" rx="8" class="b"/><text x="742" y="204" text-anchor="middle" class="s">PWM</text><line x1="805" y1="197" x2="865" y2="197" class="a"/><rect x="865" y="165" width="125" height="65" rx="8" class="b"/><text x="927" y="204" text-anchor="middle" class="s">低通滤波</text><line x1="990" y1="197" x2="1050" y2="197" class="a"/><text x="1060" y="204" class="s">Vavg</text><text x="895" y="290" text-anchor="middle" class="s">Vavg ≈ Duty·VDD；纹波与响应速度互相制约</text><rect x="35" y="365" width="540" height="255" rx="14" class="b"/><text x="305" y="398" text-anchor="middle" class="h">桥式传感器</text><path d="M160 465 L245 515 L160 565 L75 515 Z" class="w"/><text x="160" y="522" text-anchor="middle" class="s">Bridge</text><line x1="245" y1="515" x2="300" y2="515" class="a"/><rect x="300" y="465" width="145" height="100" rx="10" class="b"/><text x="372" y="507" text-anchor="middle" class="s">仪表放大器</text><text x="372" y="535" text-anchor="middle" class="s">+ 低通</text><line x1="445" y1="515" x2="510" y2="515" class="a"/><text x="305" y="600" text-anchor="middle" class="s">应变片、压力、称重：关注激励、共模、漂移与布线</text><rect x="625" y="365" width="540" height="255" rx="14" class="b"/><text x="895" y="398" text-anchor="middle" class="h">晶体 / 振荡器外围</text><rect x="825" y="470" width="140" height="75" rx="10" class="b"/><text x="895" y="515" text-anchor="middle" class="s">MCU OSC</text><rect x="700" y="480" width="75" height="55" class="b"/><text x="737" y="514" text-anchor="middle" class="s">C1</text><rect x="1015" y="480" width="75" height="55" class="b"/><text x="1052" y="514" text-anchor="middle" class="s">C2</text><line x1="775" y1="507" x2="825" y2="507" class="w"/><line x1="965" y1="507" x2="1015" y2="507" class="w"/><text x="895" y="600" text-anchor="middle" class="s">短、对称、远离开关节点；按数据手册计算负载电容</text></svg>