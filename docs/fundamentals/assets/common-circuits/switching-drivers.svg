<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}.t{font-size:28px;font-weight:700}.h{font-size:22px;font-weight:700}.s{font-size:17px}.w{stroke:#172033;stroke-width:3;fill:none}.b{stroke:#8da0b8;stroke-width:2;fill:#fff}.n{fill:#172033}</style><rect width="1200" height="700" fill="#fff"/><text x="600" y="42" text-anchor="middle" class="t">晶体管与功率驱动拓扑</text><rect x="35" y="75" width="540" height="255" rx="14" class="b"/><text x="305" y="108" text-anchor="middle" class="h">N-MOS 低边开关</text><text x="120" y="145" class="s">+VLOAD</text><rect x="105" y="170" width="100" height="60" rx="8" class="b"/><text x="155" y="207" text-anchor="middle" class="s">负载</text><line x1="155" y1="230" x2="155" y2="260" class="w"/><rect x="105" y="260" width="100" height="48" rx="8" class="b"/><text x="155" y="291" text-anchor="middle" class="s">N-MOS</text><text x="305" y="245" class="s">GPIO</text><line x1="360" y1="240" x2="455" y2="240" class="w"/><line x1="455" y1="240" x2="455" y2="284" class="w"/><line x1="455" y1="284" x2="205" y2="284" class="w"/><text x="350" y="315" text-anchor="middle" class="s">检查 VGS、RDS(on)、栅极电阻和续流</text><rect x="625" y="75" width="540" height="255" rx="14" class="b"/><text x="895" y="108" text-anchor="middle" class="h">高边负载开关</text><text x="730" y="150" class="s">+V</text><rect x="710" y="175" width="100" height="52" rx="8" class="b"/><text x="760" y="208" text-anchor="middle" class="s">P-MOS</text><line x1="760" y1="227" x2="760" y2="260" class="w"/><rect x="710" y="260" width="100" height="50" rx="8" class="b"/><text x="760" y="292" text-anchor="middle" class="s">负载</text><rect x="930" y="185" width="150" height="70" rx="8" class="b"/><text x="1005" y="227" text-anchor="middle" class="s">栅极驱动</text><line x1="930" y1="220" x2="810" y2="200" class="w"/><text x="895" y="305" text-anchor="middle" c