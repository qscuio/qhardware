<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#56657a}.h{font-size:21px;font-weight:700}.t{font-size:17px}.tiny{font-size:14px}
    .board{fill:#f8fbfd;stroke:#24364b;stroke-width:4}.power{fill:#fff3d6;stroke:#d88700;stroke-width:2.5}
    .logic{fill:#e9f8ec;stroke:#2e8b57;stroke-width:2.5}.memory{fill:#f2ebff;stroke:#7857a8;stroke-width:2.5}
    .iface{fill:#e7f2ff;stroke:#2476b8;stroke-width:2.5}.rf{fill:#fff0f3;stroke:#bd4f6c;stroke-width:2.5}
    .conn{fill:#f4f6f8;stroke:#6b7785;stroke-width:2.5}.thermal{fill:#fff7e8;stroke:#b36b00;stroke-width:2;stroke-dasharray:8 6}
    .wire{fill:none;stroke:#172033;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .arrow{fill:none;stroke:#172033;stroke-width:3;marker-end:url(#arr)}
    .powerline{fill:none;stroke:#d88700;stroke-width:5;marker-end:url(#arrp)}
    .highspeed{fill:none;stroke:#2476b8;stroke-width:4;marker-end:url(#arrb)}
    .rfline{fill:none;stroke:#bd4f6c;stroke-width:3;marker-end:url(#arrr)}
    .dash{fill:none;stroke:#8a98aa;stroke-width:2.2;stroke-dasharray:8 7}
  </style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#172033"/></marker>
    <marker id="arrp" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d88700"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2476b8"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#bd4f6c"/></marker>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">真实 PCB 案例：Raspberry Pi 4 Model B</text>
  <text x="700" y="72" text-anchor="middle" class="sub">功能分区、能量路径与高速互连示意；器件位置近似，不是制造层、阻抗图或完整原理图</text>

  <path class="board" d="M105 125 H1215 L1300 195 V710 L1235 780 H105 Z"/>

  <rect x="195" y="103" width="775" height="42" rx="8" class="conn"/>
  <text x="582" y="131" text-anchor="middle" class="t">40-pin GPIO：5 V / 3.3 V / GND / I²C / SPI / UART / PWM / HAT ID EEPROM</text>
  <rect x="1010" y="103" width="155" height="42" rx="8" class="conn"/>
  <text x="1087" y="131" text-anchor="middle" class="t">PoE HAT Header</text>

  <rect x="75" y="225" width="105" height="110" rx="10" class="conn"/>
  <text x="127" y="266" text-anchor="middle" class="h">USB-C</text>
  <text x="127" y="295" text-anchor="middle" class="t">5 V / 3 A</text>
  <text x="127" y="318" text-anchor="middle" class="tiny">Power + USB2 D±</text>

  <rect x="75" y="390" width="105" height="88" rx="10" class="conn"/>
  <text x="127" y="426" text-anchor="middle" class="h">DSI</text>
  <text x="127" y="454" text-anchor="middle" class="t">Display</text>

  <rect x="75" y="535" width="105" height="88" rx="10" class="conn"/>
  <text x="127" y="571" text-anchor="middle" class="h">CSI</text>
  <text x="127" y="599" text-anchor="middle" class="t">Camera</text>

  <rect x="255" y="735" width="150" height="66" rx="10" class="conn"/>
  <text x="330" y="765" text-anchor="middle" class="h">micro-HDMI 0</text>
  <text x="330" y="789" text-anchor="middle" class="tiny">TMDS / CEC / DDC</text>
  <rect x="430" y="735" width="150" height="66" rx="10" class="conn"/>
  <text x="505" y="765" text-anchor="middle" class="h">micro-HDMI 1</text>
  <text x="505" y="789" text-anchor="middle" class="tiny">TMDS / CEC / DDC</text>
  <rect x="605" y="735" width="118" height="66" rx="10" class="conn"/>
  <text x="664" y="765" text-anchor="middle" class="h">A/V Jack</text>
  <text x="664" y="789" text-anchor="middle" class="tiny">PWM Audio</text>
  <rect x="760" y="735" width="140" height="66" rx="10" class="conn"/>
  <text x="830" y="765" text-anchor="middle" class="h">microSD</text>
  <text x="830" y="789" text-anchor="middle" class="tiny">Boot / Storage</text>

  <rect x="1220" y="210" width="120" height="175" rx="10" class="conn"/>
  <text x="1280" y="254" text-anchor="middle" class="h">2 × USB 3</text>
  <text x="1280" y="283" text-anchor="middle" class="t">2 × USB 2</text>
  <text x="1280" y="315" text-anchor="middle" class="tiny">Downstream power</text>
  <text x="1280" y="339" text-anchor="middle" class="tiny">shared budget</text>
  <rect x="1220" y="470" width="120" height="155" rx="10" class="conn"/>
  <text x="1280" y="515" text-anchor="middle" class="h">RJ45</text>
  <text x="1280" y="544" text-anchor="middle" class="t">Gigabit</text>
  <text x="1280" y="573" text-anchor="middle" class="tiny">Magnetics + LEDs</text>
  <text x="1280" y="598" text-anchor="middle" class="tiny">PoE-capable jack</text>

  <rect x="215" y="205" width="225" height="118" rx="13" class="power"/>
  <text x="327" y="240" text-anchor="middle" class="h">输入保护与 5V_SYS</text>
  <text x="327" y="271" text-anchor="middle" class="t">CC 下拉 / TVS / 检测</text>
  <text x="327" y="299" text-anchor="middle" class="tiny">Pi 4 只使用 5 V 输入，不升压协商</text>

  <rect x="215" y="355" width="225" height="180" rx="13" class="power"/>
  <text x="327" y="391" text-anchor="middle" class="h">多路 PMIC + 时序</text>
  <text x="327" y="424" text-anchor="middle" class="t">3.3 V / 1.8 V</text>
  <text x="327" y="454" text-anchor="middle" class="t">DDR / Core / SoC Rails</text>
  <text x="327" y="486" text-anchor="middle" class="tiny">PGOOD、GLOBAL_EN、RUN</text>
  <text x="327" y="511" text-anchor="middle" class="tiny">不同板修订可能使用不同 PMIC</text>

  <rect x="535" y="245" width="310" height="250" rx="16" class="logic"/>
  <text x="690" y="292" text-anchor="middle" class="h">BCM2711 SoC</text>
  <text x="690" y="329" text-anchor="middle" class="t">4 × Cortex-A72 + VideoCore VI</text>
  <text x="690" y="362" text-anchor="middle" class="t">PCIe / GbE MAC / HDMI / CSI / DSI</text>
  <text x="690" y="395" text-anchor="middle" class="t">GPIO / SDIO / UART / SPI / I²C</text>
  <rect x="580" y="423" width="220" height="48" rx="9" class="thermal"/>
  <text x="690" y="454" text-anchor="middle" class="t">主要热源：铜皮、气流与散热器共同作用</text>

  <rect x="545" y="535" width="290" height="105" rx="13" class="memory"/>
  <text x="690" y="574" text-anchor="middle" class="h">LPDDR4 SDRAM</text>
  <text x="690" y="606" text-anchor="middle" class="t">高速并行总线：短、匹配、参考面连续</text>
  <text x="690" y="629" text-anchor="middle" class="tiny">容量随型号而异；不可按普通 GPIO 经验布线</text>

  <rect x="465" y="175" width="165" height="68" rx="10" class="memory"/>
  <text x="547" y="205" text-anchor="middle" class="h">SPI Boot EEPROM</text>
  <text x="547" y="229" text-anchor="middle" class="tiny">板载启动加载器与恢复配置</text>

  <rect x="905" y="230" width="205" height="125" rx="13" class="iface"/>
  <text x="1007" y="269" text-anchor="middle" class="h">VL805 USB 3 控制器</text>
  <text x="1007" y="302" text-anchor="middle" class="t">BCM2711 PCIe → USB 3/2</text>
  <text x="1007" y="330" text-anchor="middle" class="tiny">差分对、参考面、供电与端口限流</text>

  <rect x="915" y="470" width="195" height="112" rx="13" class="iface"/>
  <text x="1012" y="509" text-anchor="middle" class="h">Gigabit Ethernet PHY</text>
  <text x="1012" y="542" text-anchor="middle" class="t">MAC ↔ PHY ↔ Magnetics</text>
  <text x="1012" y="568" text-anchor="middle" class="tiny">四对差分线与中心抽头网络</text>

  <rect x="930" y="610" width="185" height="102" rx="13" class="rf"/>
  <text x="1022" y="648" text-anchor="middle" class="h">Wi-Fi / Bluetooth</text>
  <text x="1022" y="678" text-anchor="middle" class="t">Combo IC + RF Match</text>
  <text x="1022" y="702" text-anchor="middle" class="tiny">天线端靠板边并保持净空</text>
  <path d="M1115 658 H1190" class="rfline"/>
  <path d="M1190 628 q80 30 0 60 q80 30 0 60" class="rfline"/>

  <path d="M180 280 H215" class="powerline"/>
  <path d="M327 323 V355" class="powerline"/>
  <path d="M440 445 H500 V370 H535" class="powerline"/>
  <path d="M440 470 H505 V585 H545" class="powerline"/>
  <path d="M630 209 H690 V245" class="arrow"/>
  <path d="M690 495 V535" class="highspeed"/>
  <path d="M845 322 H905" class="highspeed"/>
  <path d="M1110 292 H1220" class="highspeed"/>
  <path d="M845 520 H915" class="highspeed"/>
  <path d="M1110 526 H1220" class="highspeed"/>
  <path d="M845 415 H875 V661 H930" class="arrow"/>
  <path d="M620 495 V705 H330 V735" class="highspeed"/>
  <path d="M670 495 V690 H505 V735" class="highspeed"/>
  <path d="M730 495 V705 H830 V735" class="arrow"/>
  <path d="M535 385 H480 V434 H180" class="highspeed"/>
  <path d="M535 410 H465 V579 H180" class="highspeed"/>
  <path d="M680 245 V145" class="arrow"/>

  <rect x="85" y="825" width="1230" height="58" rx="12" fill="#f7f9fc" stroke="#c7d0da" stroke-width="2"/>
  <line x1="115" y1="850" x2="165" y2="850" class="powerline"/><text x="178" y="857" class="t">能量/电源</text>
  <line x1="315" y1="850" x2="365" y2="850" class="highspeed"/><text x="378" y="857" class="t">高速数据</text>
  <line x1="515" y1="850" x2="565" y2="850" class="arrow"/><text x="578" y="857" class="t">控制/低速</text>
  <text x="700" y="842" class="tiny">阅读重点：Pi 4 是多电源域、高速互连、启动固件、射频与热设计共同构成的 SBC。</text>
  <text x="700" y="861" class="tiny">橙色追电源，蓝色追高速数据，黑色追控制与启动。</text>
  <text x="700" y="880" class="tiny">复制设计时必须回到官方资料，并核对具体板修订。</text>
</svg>
