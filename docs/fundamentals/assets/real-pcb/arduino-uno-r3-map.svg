<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#56657a}.h{font-size:21px;font-weight:700}.t{font-size:17px}.tiny{font-size:14px}
    .board{fill:#f7fbff;stroke:#24364b;stroke-width:4}.power{fill:#fff3d6;stroke:#d88700;stroke-width:2.5}.iface{fill:#e7f2ff;stroke:#2476b8;stroke-width:2.5}
    .logic{fill:#e9f8ec;stroke:#2e8b57;stroke-width:2.5}.passive{fill:#f2ebff;stroke:#7857a8;stroke-width:2.5}.conn{fill:#f4f6f8;stroke:#6b7785;stroke-width:2.5}
    .wire{fill:none;stroke:#172033;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:none;stroke:#172033;stroke-width:3;marker-end:url(#arr)}
    .dash{fill:none;stroke:#8a98aa;stroke-width:2;stroke-dasharray:8 7}.node{fill:#172033}
  </style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#172033"/></marker></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">真实 PCB 案例：Arduino UNO R3</text>
  <text x="600" y="70" text-anchor="middle" class="sub">功能分区与主要能量 / 信息路径示意；位置近似，不是制造层或精确封装图</text>

  <path class="board" d="M125 110 H940 L1000 165 V565 L950 615 H125 Z"/>
  <rect x="82" y="180" width="105" height="120" rx="8" class="conn"/><text x="134" y="230" text-anchor="middle" class="h">USB-B</text><text x="134" y="258" text-anchor="middle" class="t">X2</text>
  <rect x="82" y="475" width="120" height="92" rx="8" class="conn"/><text x="142" y="516" text-anchor="middle" class="h">DC Jack</text><text x="142" y="543" text-anchor="middle" class="t">X1 / VIN</text>

  <rect x="230" y="145" width="210" height="105" rx="12" class="iface"/><text x="335" y="182" text-anchor="middle" class="h">USB 串口桥</text><text x="335" y="211" text-anchor="middle" class="t">ATmega16U2 + USB 保护</text><text x="335" y="234" text-anchor="middle" class="tiny">USB D+/D− → UART</text>
  <rect x="230" y="285" width="210" height="120" rx="12" class="power"/><text x="335" y="321" text-anchor="middle" class="h">自动电源选择</text><text x="335" y="350" text-anchor="middle" class="t">LMV358 + P-MOSFET</text><text x="335" y="376" text-anchor="middle" class="tiny">比较 VIN/2 与 3.3 V</text>
  <rect x="230" y="450" width="210" height="105" rx="12" class="power"/><text x="335" y="487" text-anchor="middle" class="h">线性稳压</text><text x="335" y="516" text-anchor="middle" class="t">VIN → 5 V LDO</text><text x="335" y="540" text-anchor="middle" class="tiny">反接二极管 + 储能电容</text>

  <rect x="520" y="205" width="320" height="235" rx="14" class="logic"/><text x="680" y="248" text-anchor="middle" class="h">主控制器</text><text x="680" y="286" text-anchor="middle" class="h">ATmega328P</text><text x="680" y="322" text-anchor="middle" class="t">GPIO / ADC / SPI / I²C / UART</text><text x="680" y="354" text-anchor="middle" class="t">RESET、AREF、AVCC 与去耦</text><rect x="565" y="375" width="230" height="42" rx="8" class="passive"/><text x="680" y="402" text-anchor="middle" class="t">16 MHz 时钟网络</text>
  <rect x="520" y="470" width="320" height="95" rx="12" class="passive"/><text x="680" y="504" text-anchor="middle" class="h">复位与自动下载</text><text x="680" y="534" text-anchor="middle" class="t">DTR → 100 nF → RESET；10 kΩ 上拉</text>

  <rect x="170" y="100" width="700" height="34" rx="7" class="conn"/><text x="520" y="123" text-anchor="middle" class="t">数字 IO / SPI / AREF 顶部排针</text>
  <rect x="170" y="590" width="700" height="34" rx="7" class="conn"/><text x="520" y="613" text-anchor="middle" class="t">电源 / 模拟输入 / I²C 底部排针</text>
  <rect x="895" y="235" width="72" height="150" rx="9" class="conn"/><text x="931" y="302" text-anchor="middle" class="t" transform="rotate(90 931 302)">ICSP / 测试点</text>

  <path d="M187 235 H230" class="arrow"/><path d="M440 198 H500 V285 H520" class="arrow"/>
  <path d="M202 520 H230" class="arrow"/><path d="M440 503 H470 V345 H520" class="arrow"/>
  <path d="M440 345 H485" class="wire"/><circle cx="485" cy="345" r="5" class="node"/><path d="M485 345 V170 H520" class="arrow"/>
  <path d="M440 198 H470 V518 H520" class="dash"/>
  <path d="M840 322 H895" class="arrow"/>

  <rect x="75" y="660" width="1050" height="72" rx="12" fill="#f7f9fc" stroke="#c7d0da" stroke-width="2"/>
  <text x="105" y="690" class="h">阅读重点：</text>
  <text x="245" y="690" class="t">USB 和 VIN 是两条独立电源路径；比较器只做选择，不承担主电流。</text>
  <text x="245" y="718" class="t">信息路径是 USB → ATmega16U2 → UART → ATmega328P；复位、时钟和去耦是“能运行”的必要外围。</text>
</svg>
