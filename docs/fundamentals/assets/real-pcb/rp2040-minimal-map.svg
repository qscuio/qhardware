<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#172033}
    .title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#56657a}.h{font-size:21px;font-weight:700}.t{font-size:17px}.tiny{font-size:14px}
    .board{fill:#f7fbff;stroke:#24364b;stroke-width:4}.power{fill:#fff3d6;stroke:#d88700;stroke-width:2.5}.iface{fill:#e7f2ff;stroke:#2476b8;stroke-width:2.5}
    .logic{fill:#e9f8ec;stroke:#2e8b57;stroke-width:2.5}.passive{fill:#f2ebff;stroke:#7857a8;stroke-width:2.5}.conn{fill:#f4f6f8;stroke:#6b7785;stroke-width:2.5}
    .plane{fill:#eef5f7;stroke:#4c7b84;stroke-width:2;stroke-dasharray:9 7}.wire{fill:none;stroke:#172033;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .arrow{fill:none;stroke:#172033;stroke-width:3;marker-end:url(#arr)}.diff{fill:none;stroke:#2476b8;stroke-width:3}.dash{fill:none;stroke:#8a98aa;stroke-width:2;stroke-dasharray:8 7}
  </style>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#172033"/></marker></defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="600" y="42" text-anchor="middle" class="title">真实 PCB 案例：RP2040 官方最小系统板</text>
  <text x="600" y="70" text-anchor="middle" class="sub">Raspberry Pi 官方已验证的两层、单面贴装参考设计；功能位置简化示意</text>

  <rect x="135" y="110" width="930" height="520" rx="18" class="board"/>
  <rect x="165" y="140" width="870" height="460" rx="14" class="plane"/>
  <text x="1000" y="585" text-anchor="end" class="tiny">连续 GND 平面：给 USB、时钟、QSPI 和 GPIO 提供短回流路径</text>

  <rect x="90" y="260" width="145" height="105" rx="10" class="conn"/>
  <text x="162" y="301" text-anchor="middle" class="h">Micro-USB</text><text x="162" y="330" text-anchor="middle" class="t">VBUS / D+ / D−</text>
  <rect x="265" y="245" width="150" height="135" rx="11" class="iface"/>
  <text x="340" y="279" text-anchor="middle" class="h">USB 前端</text><text x="340" y="309" text-anchor="middle" class="t">D+ / D− 各 27 Ω</text><text x="340" y="336" text-anchor="middle" class="tiny">90 Ω 差分、下方连续地</text><text x="340" y="360" text-anchor="middle" class="tiny">电阻靠近 RP2040</text>

  <rect x="270" y="145" width="190" height="80" rx="11" class="power"/>
  <text x="365" y="179" text-anchor="middle" class="h">3.3 V 稳压</text><text x="365" y="207" text-anchor="middle" class="t">NCP1117 + 10 µF 输入/输出</text>

  <rect x="500" y="235" width="260" height="220" rx="15" class="logic"/>
  <text x="630" y="278" text-anchor="middle" class="h">RP2040</text>
  <text x="630" y="313" text-anchor="middle" class="t">双核 MCU / USB / PIO / ADC</text>
  <rect x="530" y="342" width="200" height="84" rx="9" class="passive"/>
  <text x="630" y="369" text-anchor="middle" class="t">每个电源脚附近 100 nF</text>
  <text x="630" y="394" text-anchor="middle" class="t">VREG_IN / OUT 各 1 µF</text>
  <text x="630" y="417" text-anchor="middle" class="tiny">内部稳压器产生约 1.1 V 核心电源</text>

  <rect x="800" y="175" width="180" height="105" rx="11" class="iface"/>
  <text x="890" y="211" text-anchor="middle" class="h">QSPI Flash</text><text x="890" y="241" text-anchor="middle" class="t">W25Q128JVSIQ</text><text x="890" y="264" text-anchor="middle" class="tiny">短、成组、避免长支线</text>
  <rect x="800" y="315" width="180" height="95" rx="11" class="passive"/>
  <text x="890" y="348" text-anchor="middle" class="h">BOOTSEL</text><text x="890" y="377" text-anchor="middle" class="t">按键 + QSPI_SS + 1 kΩ</text><text x="890" y="398" text-anchor="middle" class="tiny">按住复位进入 USB Boot</text>
  <rect x="790" y="470" width="200" height="95" rx="11" class="passive"/>
  <text x="890" y="503" text-anchor="middle" class="h">12 MHz 晶体</text><text x="890" y="532" text-anchor="middle" class="t">ABM8 + 15 pF × 2</text><text x="890" y="554" text-anchor="middle" class="tiny">紧靠 XIN/XOUT、回路很小</text>

  <rect x="190" y="455" width="245" height="105" rx="11" class="conn"/>
  <text x="312" y="490" text-anchor="middle" class="h">调试与扩展</text><text x="312" y="520" text-anchor="middle" class="t">SWD / RUN / GPIO 排针</text><text x="312" y="545" text-anchor="middle" class="tiny">测试点和明确的地参考</text>

  <path d="M235 312 H265" class="arrow"/><path d="M415 312 H500" class="diff"/><path d="M415 326 H500" class="diff"/>
  <path d="M235 285 H250 V185 H270" class="arrow"/><path d="M460 185 H630 V235" class="arrow"/>
  <path d="M760 280 H800" class="arrow"/><path d="M760 362 H800" class="arrow"/><path d="M760 422 H770 V517 H790" class="arrow"/>
  <path d="M500 500 H435" class="arrow"/><path d="M630 455 V500 H435" class="dash"/>

  <rect x="70" y="665" width="1060" height="72" rx="12" fill="#f7f9fc" stroke="#c7d0da" stroke-width="2"/>
  <text x="100" y="695" class="h">阅读重点：</text>
  <text x="242" y="695" class="t">“最小系统”并不只是 MCU：电源、去耦、Flash、BOOTSEL、晶体、USB 串阻、接地和调试接口缺一不可。</text>
  <text x="242" y="723" class="t">这个官方设计刻意保持两层且全部器件在顶层，适合学习“可生产、可调试、可复制”的低成本 MCU 板。</text>
</svg>
