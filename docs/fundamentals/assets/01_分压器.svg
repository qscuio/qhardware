<style>
  text { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; fill:#111; }
  .wire { stroke:#111; stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
