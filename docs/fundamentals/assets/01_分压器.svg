<text x="450.0" y="34" class="title" text-anchor="middle">电阻分压器</text>
<text x="150" y="100" class="label" text-anchor="middle">Vin</text><line x1="150" y1="120" x2="150" y2="160" class="wire"/><polyline points="150,160 150,195 132,205.0 168,215.0 132,225.0 168,235.0 132,245.0 168,255.0 132,265.0 168,275.0 150,285 150,320" class="wire"/><text x="202" y="247.0" class="label" text-anchor="start">R1</text><circle cx="150" cy="320" r="5" class="node"/><line x1="150" y1="320" x2="420" y2="320" class="wire"/><text x="450" y="327" class="label" text-anchor="start">Vout</text><polyline points="150,320 150,355 132,365.0 168,375.0 132,385.0 168,395.0 132,405.0 168,415.0 132,425.0 168,435.0 150,445 150,480" class="wire"/><text x="202" y="407.0" class="label" text-anchor="start">R2</text><line x1="150" y1="480" x2="150" y2="500" class="wire"/><line x1="120" y1="500" x2="180" y2="500" class="wire"/><line x1="130" y1="512" x2="170" y2="512" class="wire"/><line x1="140" y1="524" x2="160" y2="524" class="wire"/><text x="540" y="205" class="label" text-anchor="start">Vout = Vin × R2 / (R1 + R2)</text><text x="540" y="250" class="small" text-anchor="start">例：Vin=5V，R1=R2=10kΩ → Vout=2.5V</text></svg>