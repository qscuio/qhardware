<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><rect width="920" height="520" fill="white"/><g stroke="#111" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="180" y1="80" x2="180" y2="120"/><polyline points="180,120 160,140 200,160 160,180 200,200 160,220 200,240 180,260"/><line x1="180" y1="260" x2="180" y2="300"/><circle cx="180" cy="300" r="5" fill="#111"/><line x1="180" y1="300" x2="420" y2="300"/><polyline points="180,300 160,320 200,340 160,360 200,380 160,400 200,420 180,440"/><line x1="180" y1="440" x2="180" y2="465"/><line x1="145" y1="465" x2="215" y2="465"/><line x1="155" y1="478" x2="205" y2="478"/><line x1="166" y1="491" x2="194" y2="491"/></g><g font-family="Arial, sans-serif" fill="#111"><text x="180" y="52" text-anchor="middle" font-size="24" font-weight="700">Vin</text><text x="230" y="195" font-size="22">R1</text><text x="230" y="380" font-size="22">R2</text><text x="440" y="307" font-size="24" font-weight="700">Vout</text><text x="520" y="190" font-size="22">Vout = Vin × R2 / (R1 + R2)</text><text x="520" y="235" font-size="19">R1 = R2 时，Vout = Vin / 2</text><text x="520" y="290" font-size="19">注意：接入负载后，R2 会被“并联改变”</text></g></svg>