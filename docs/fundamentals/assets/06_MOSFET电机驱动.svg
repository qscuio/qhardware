<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#111}.wire{stroke:#111;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.thin{stroke:#111;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}.label{font-size:20px}.small{font-size:17px}.title{font-size:24px;font-weight:700}.box{fill:none;stroke:#111;stroke-width:2.5}</style><text x="560" y="34" class="title" text-anchor="middle">N-MOSFET 低边驱动直流电机</text><text x="760" y="90" class="label" text-anchor="middle">+Vmotor</text><line x1="760" y1="105" x2="760" y2="145" class="wire"/><rect x="680" y="145" width="160" height="90" class="box"/><text x="760" y="197" class="label" text-anchor="middle">直流电机</text><line x1="760" y1="235" x2="760" y2="300" class="wire"/><line x1="760" y1="125" x2="965" y2="125" class="wire"/><line x1="965" y1="125" x2="965" y2="175" class="wire"/><line x1="965" y1="285" x2="965" y2="300" class="wire"/><line x1="965" y1="300" x2="760" y2="300" class="wire"/><line x1="930" y1="190" x2="1000" y2="190" class="thin"/><polygon points="930,270 1000,270 965,205" class="thin"/><line x1="965" y1="175" x2="965" y2="190" class="wire"/><line x1="965" y1="270" x2="965" y2="285" class="wire"/><text x="1005" y="235" class="small" text-anchor="start">续流二极管</text><line x1="760" y1="300" x2="760" y2="345" class="wire"/><line x1="760" y1="345" x2="760" y2="430" class="thin"/><line x1="760" y1="430" x2="760" y2="485" class="wire"/><line x1="690" y1="350" x2="690" y2="425" class="thin"/><line x1="610" y1="388" x2="690" y2="388" class="wire"/><text x="785" y="350" class="small" text-anchor="start">D</text><text x="785" y="450" class="small" text-anchor="start">S</text><text x="675" y="340" class="small" text-anchor="end">G</text><text x="830" y="395" class="small" text-anchor="start">N-MOSFET</text><line x1="760" y1="485" x2="760" y2="525" class="wire"/><line x1="760" y1="525" x2="760" y2="545" class="wire"/><line x1="730" y1="545" x2="790" y2="545" class="wire"/><line x1="740" y1="557" x2="780" y2="557" class="wire"/><line x1="750" y1="569" x2="770" y2="569" class="wire"/><rect x="90" y="345" width="190" height="85" class="box"/><text x="185" y="394" class="label" text-anchor="middle">ESP32 GPIO</text><line x1="280" y1="388" x2="610" y2="388" class="wire"/><line x1="185" y1="430" x2="185" y2="525" class="wire"/><line x1="185" y1="525" x2="760" y2="525" class="wire"/><text x="525" y="625" class="small" text-anchor="middle">GPIO 只负责控制；电机的功率来自 Vmotor。</text><text x="525" y="660" class="small" text-anchor="middle">ESP32 GND 与电机电源负端共地；续流二极管为关断后的电感电流提供回路。</text></svg>